<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to Photo Memory</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script>
    (function () {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      const isAndroid = /android/i.test(userAgent);
      const isIOS = /iPad|iPhone|iPod/.test(userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      if (isAndroid) {
        window.location.href = 'intent://photo-memory#Intent;scheme=app;package=com.XanderDevelops.PhotographicMemory;end;';
      } else if (isIOS) {
        window.location.href = 'Photo Memory://';
        setTimeout(function () {
          window.location.href = 'https://apps.apple.com/mw/app/photographic-memory-mind-test/id6578423386';
        }, 2500);
      } else {
        window.location.href = 'https://photographicmemory.vercel.app/';
      }
    })();
  </script>
</head>
<body class="verify-page">
  <main class="verify-box">
    <h1>Photo Memory</h1>
    <p>Redirecting to the app...</p>
    <a class="back-btn" href="index.html">Back to site</a>
  </main>
</body>
</html>
